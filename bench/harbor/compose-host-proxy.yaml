# Overlay for Linux Docker: task containers cannot use 127.0.0.1 of the host.
# Clash/mihomo must listen on the host gateway (allow-lan).
services:
  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      http_proxy: http://host.docker.internal:7890
      https_proxy: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,::1,aiservice.jellytoken.com,.jellytoken.com,uni-api.cstcloud.cn,.cstcloud.cn
      no_proxy: localhost,127.0.0.1,::1,aiservice.jellytoken.com,.jellytoken.com,uni-api.cstcloud.cn,.cstcloud.cn
